on:
  workflow_call:
    inputs:
      refs:
        required: false
        type: string
      release-tag-name:
        required: true
        type: string
      push:
        required: true
        type: boolean
      skip-ci:
        required: false
        type: boolean
        default: false
      skip-integration-tests:
        required: false
        type: boolean
        default: false
env:
  PLATFORMS: linux/amd64,linux/arm64
  LIBVIRT_DEFAULT_URI: "qemu:///system"

jobs:
  ci:
    if: ${{ inputs.skip-ci == false }}
    runs-on:
      - self-hosted
      - golang
    steps:
      - name: Checkout code without refs
        if: ${{ inputs.refs == '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout code with refs
        if: ${{ inputs.refs != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.refs }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: "Run validations"
        run: |
          make validate
          make validate-ci

      - name: "Build node manager"
        run: |
          BUILD_FOR_CI=true make

      - name: "Setup vagrant rancherd"
        if: ${{ inputs.skip-integration-tests == false }}
        run: |
          rm -rf nm-vagrant-rancherd
          git clone https://github.com/harvester/vagrant-rancherd nm-vagrant-rancherd
          cd nm-vagrant-rancherd
          cat ./settings.yaml
          echo "VAGRANT_RANCHERD_HOME=$(pwd)" >> $GITHUB_ENV
          ./new_cluster.sh

      - name: "Deploy latest node manager"
        if: ${{ inputs.skip-integration-tests == false }}
        run: |
          ./ci/deploy_nm.sh $VAGRANT_RANCHERD_HOME

      - name: "Upgrade node manager to dev version"
        if: ${{ inputs.skip-integration-tests == false }}
        run: |
          ./ci/upgrade_nm.sh $VAGRANT_RANCHERD_HOME

      - name: "Run integration tests"
        if: ${{ inputs.skip-integration-tests == false }}
        run: |
          VAGRANT_RANCHERD_HOME=$VAGRANT_RANCHERD_HOME go test -v ./tests/... -count=1

      - name: "Tear Down / Cleanup"
        if: ${{ always() && inputs.skip-integration-tests == false }}
        run: |
          cd $VAGRANT_RANCHERD_HOME
          vagrant destroy -f --parallel

  dapper-build:
    needs: ci
    if: ${{ always() && inputs.push == true && (inputs.skip-ci == true || needs.ci.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: harvester-node-manager
            dockerfile: package/Dockerfile
          - image: harvester-node-manager-webhook
            dockerfile: package/Dockerfile.webhook
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: ci
        run: make ci

      - name: Package
        run: make package

      - name: Package webhook
        run: make package-webhook

      - name: Build and publish ${{ matrix.image }} image
        uses: harvester/harvester-actions/actions/build-and-publish@18134d283bc63c5a7ffb25191e6cd2f367a10932 # main
        with:
          release-tag-name: ${{ inputs.release-tag-name }}
          image: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
